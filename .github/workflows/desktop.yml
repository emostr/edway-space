name: Настольное приложение

# Сборка установщиков под три системы. Кросс-сборки нет: каждый образ
# собирает своё, иначе macOS-пакет не подписать, а deb — не собрать.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      defaultUrl:
        description: 'Адрес сервера, зашитый в сборку (можно оставить пустым)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Установка зависимостей
        working-directory: desktop
        run: npm ci

      - name: Сборка приложения
        working-directory: desktop
        run: npm run build

      - name: Сборка установщиков
        working-directory: desktop
        env:
          # Подписи нет: школьная сборка ставится вручную, о чём написано
          # на странице загрузки.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EDWAY_DEFAULT_URL: ${{ github.event.inputs.defaultUrl }}
        run: node scripts/build-installers.mjs ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: edway-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.deb
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
