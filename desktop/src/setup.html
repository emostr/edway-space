<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Подключение · edway.space</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      .box {
        width: 100%;
        max-width: 28rem;
      }
      .bar {
        width: 40px;
        height: 4px;
        background: #00b294;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 26px;
        font-weight: 800;
      }
      p.lead {
        margin: 0 0 22px;
        color: #8a8a8a;
        font-size: 14px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: #8a8a8a;
      }
      input {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        color: #f5f5f5;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #00b294;
      }
      button {
        margin-top: 16px;
        width: 100%;
        height: 44px;
        border: 0;
        background: #00b294;
        color: #04231d;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .note {
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid #2a2a2a;
        border-left: 3px solid #2f86d4;
        color: #8a8a8a;
        font-size: 13px;
      }
      .note.error {
        border-left-color: #e03e3e;
        color: #f5f5f5;
      }
      .note.ok {
        border-left-color: #16a06a;
        color: #f5f5f5;
      }
      .hint {
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid #2a2a2a;
        color: #5a5a5a;
        font-size: 12px;
      }
      code {
        color: #8a8a8a;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="bar"></div>
      <h1>Адрес платформы</h1>
      <p class="lead">
        Приложение открывает вашу школьную платформу. Адрес подскажет тот, кто её разворачивал, —
        он же написан в подвале сайта на странице загрузки.
      </p>

      <label for="url">Адрес сервера</label>
      <input id="url" type="text" placeholder="edway.school.ru" autocomplete="off" spellcheck="false" />
      <button id="connect" type="button">Подключиться</button>

      <div id="note" class="note" hidden></div>

      <div class="hint">
        Можно указать и адрес в школьной сети: <code>http://192.168.1.10:8020</code>. Адрес
        запоминается — менять его потом можно в меню «Файл → Адрес сервера».
      </div>
    </div>

    <script>
      const field = document.getElementById('url');
      const button = document.getElementById('connect');
      const note = document.getElementById('note');

      function show(text, kind) {
        note.textContent = text;
        note.className = 'note' + (kind ? ' ' + kind : '');
        note.hidden = false;
      }

      const params = new URLSearchParams(location.search);
      if (params.get('url')) {
        field.value = params.get('url');
      }
      if (params.get('error') === 'unreachable') {
        show(
          'Не удалось открыть ' + (params.get('url') || 'сервер') + '. Проверьте адрес и сеть.',
          'error',
        );
      }

      window.edway.getServer().then((saved) => {
        if (saved && !field.value) {
          field.value = saved;
        }
        field.focus();
      });

      async function connect() {
        const value = field.value.trim();
        if (!value) {
          show('Введите адрес сервера', 'error');
          field.focus();
          return;
        }

        button.disabled = true;
        show('Проверяем адрес…');
        try {
          const result = await window.edway.connect(value);
          if (!result.ok) {
            show(result.message, 'error');
          } else {
            show('Сервер найден, открываем платформу…', 'ok');
          }
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener('click', connect);
      field.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          connect();
        }
      });
    </script>
  </body>
</html>
