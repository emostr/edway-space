appId: space.edway.desktop
productName: edway.space
copyright: edway.space

directories:
  output: release
  buildResources: build

# В сборку идёт только собранное приложение: исходники и зависимости
# сборщика внутри установщика не нужны.
files:
  - dist/**/*
  - package.json

# Имена предсказуемые: на них ссылается страница загрузки платформы, и ссылки
# не должны ломаться от версии к версии.
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: edway-space-${arch}.${ext}
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: edway-space-setup-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: edway.space
  language: "1049"

portable:
  artifactName: edway-space-portable-${arch}.${ext}

linux:
  category: Education
  synopsis: Школьная платформа тестирования
  description: Конструктор тестов, печать бланков и проверка работ
  desktop:
    entry:
      Name: edway.space
      Comment: Школьная платформа тестирования
      Categories: Education;Office;
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]

deb:
  artifactName: edway-space-${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

appImage:
  artifactName: edway-space-${arch}.${ext}
