services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edway}
      POSTGRES_DB: ${POSTGRES_DB:-edway}
    volumes:
      # В образах 18+ том монтируется в /var/lib/postgresql целиком: сами данные
      # лежат в подкаталоге, и обновление мажорной версии не упирается в границу
      # точки монтирования.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-edway} -d ${POSTGRES_DB:-edway}']
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-edway}:${POSTGRES_PASSWORD:-edway}@postgres:5432/${POSTGRES_DB:-edway}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8020}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      UPLOAD_DIR: /data/uploads
      OCR_DEBUG_DIR: ${OCR_DEBUG_DIR:-}
      # Администратор платформы создаётся при первом запуске.
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-edway.space}
      # Стоимость подписки школы на год, в рублях.
      PRICE_RUB: ${PRICE_RUB:-14900}
      # Ключи ЮKassa. Пустые — касса работает в учебном режиме: путь оплаты
      # собирается целиком, но денег не двигает.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      # Состав чека передаём только магазину с онлайн-кассой.
      YOOKASSA_RECEIPT: ${YOOKASSA_RECEIPT:-off}
      # Пороги защиты от перебора и спама.
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5}
    volumes:
      # Сканы работ и картинки заданий переживают пересборку образа.
      - uploads:/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-http://localhost:8020}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@edway.space}
        NEXT_PUBLIC_OPERATOR_NAME: ${OPERATOR_NAME:-}
        NEXT_PUBLIC_OPERATOR_STATUS: ${OPERATOR_STATUS:-}
        NEXT_PUBLIC_OPERATOR_INN: ${OPERATOR_INN:-}
        NEXT_PUBLIC_OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
        NEXT_PUBLIC_OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
        NEXT_PUBLIC_DOCS_DATE: ${DOCS_DATE:-}
    restart: unless-stopped
    depends_on:
      - backend

  edge:
    build: ./edge
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8020}:80'

volumes:
  pgdata:
  uploads:
